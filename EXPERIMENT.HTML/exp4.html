<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <fieldset>
      <legend>Biodata</legend>
      <form action="./response.html" >
        <label for="name">UserName:</label>
        <input
          type="text"
          name="name"
          id="name"
          \
          placeholder="Enter your Name"
        />
        <br /><br />
        <label for="password">Password:</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Enter your Password"
        />
        <br /><br />
        <label for="dob">DOB:</label>
        <input type="date" name="dob" id="dob" />

        <br /><br />
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="male" value="male" /><label
          for="male"
          >Male</label
        >
        <input type="radio" name="gender" id="female" value="female" /><label
          for="female"
          >Female</label>
        <br /><br />
        <label for="hobb1">HOBBIES:</label>
        <input type="checkbox" name="hobb2"
         id="hobb">Cricket</label>
        <input type="checkbox" name="hobb2"
         id="hobb2">Football</label>

        <br /><br />
        <label for="add">Address:</label>
        <textarea name="add" id="add"></textarea>
        <br /><br />
        <label for="tel">Phone:</label>
        <input type="tel" name="tel" id="tel" />
        <br /><br />
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" >
        <br /><br />
        <label for="att">Attempt:</label>
        <input type="number" name="att" id="att">

        <br /><br />
        <label for="url">homepage:</label>
        <input type="url" name="url" id="url" >

        <br /><br />
        <label for="file">Resume upload:</label>
        <input type="file" name="file" id="file">

        <br /><br />
        <input type="submit" value="Submit" />
        <input type="reset" value="Reset" />

      </form>
    </fieldset>
  </body>
</html>
